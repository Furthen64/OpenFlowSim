# Numerical comparison tolerances for OpenFlowSim validation harness.
#
# Each field entry specifies absolute and relative tolerances.
# A value passes if |a - b| <= atol + rtol * |b|
#
# Tolerances are intentionally tight: they reflect expected differences
# between two correct implementations of the same discretisation, not
# a blanket "close enough".

[default]
atol = 1e-10
rtol = 1e-8

[fields.U]
atol = 1e-10
rtol = 1e-8

[fields.phi]
atol = 1e-12
rtol = 1e-10

[fields.Phi]
atol = 1e-10
rtol = 1e-8
gauge_align = true

[fields.p]
atol = 1e-10
rtol = 1e-5
gauge_align = true

[cases.simpleChannel]
[cases.simpleChannel.fields.U]
atol = 1e-12
rtol = 1e-10

[cases.cylinder]
[cases.cylinder.fields.U]
atol = 1e-8
rtol = 1e-6

[cases.pitzDaily]
[cases.pitzDaily.fields.U]
atol = 1e-8
rtol = 1e-6

[cases.cavity.fields.U]
atol = 1e-10
rtol = 1e-5
relative_l2 = 1e-5

[cases.cavity.fields.p]
atol = 1e-10
rtol = 1e-5
relative_l2 = 1e-5

[cases.cavity.fields.phi]
atol = 1e-12
rtol = 1e-5
relative_l2 = 1e-5

[cases.pipeFlow.fields.U]
atol = 1e-10
rtol = 1e-5
relative_l2 = 1e-5

[cases.pipeFlow.fields.p]
atol = 1e-10
rtol = 1e-5
relative_l2 = 1e-5

[cases.pipeFlow.fields.phi]
atol = 1e-12
rtol = 1e-5
relative_l2 = 1e-5

[cases.backwardFacingStep.fields.U]
atol = 1e-10
rtol = 1e-5
relative_l2 = 1e-5

[cases.backwardFacingStep.fields.p]
atol = 1e-10
rtol = 1e-5
relative_l2 = 1e-5

[cases.backwardFacingStep.fields.phi]
atol = 1e-12
rtol = 1e-5
relative_l2 = 1e-5
